[[language]]
name             = "css"
auto-format      = true
formatter        = { command = "prettier", args = [ "--parser", "css" ] }
language-servers = [ "vscode-css-language-server", "emmet-ls" ]

[[language]]
name             = "hcl"
language-id      = "terraform"
language-servers = [ "terraform-ls" ]

[[language]]
name             = "html"
auto-format      = true
formatter        = { command = "prettier", args = [ "--parser", "html" ] }
language-servers = [ "vscode-html-language-server", "emmet-ls" ]

[[language]]
name             = "javascript"
auto-format      = true
formatter        = { command = "prettier", args = [ "--parser", "typescript" ] }
language-servers = [ "vtsls" ]

[[language]]
name        = "json"
auto-format = true
formatter   = { command = "prettier", args = [ "--parser", "json" ] }

[[language]]
name             = "jsx"
auto-format      = true
formatter        = { command = "prettier", args = [ "--parser", "typescript" ] }
language-servers = [ "vtsls", "emmet-ls" ]

[[language]]
name = "markdown"
# formatter        = { command = "dprint", args = [ "fmt", "--stdin", "md" ] }
# language-servers = [ "markdown-oxide" ]

[[language]]
name = "nix"
auto-format = true

[[language]]
name             = "rust"
language-servers = [ "rust-analyzer", "typos" ]

[[language]]
name        = "scheme"
auto-format = false
formatter   = { command = "schemat" }
# indent = { tab-width = 2, unit = "  " }

[[language]]
name             = "tfvars"
language-id      = "terraform-vars"
language-servers = [ "terraform-ls" ]

[[language]]
name        = "toml"
auto-format = false

[[language]]
name = "tsx"
auto-format = true
formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
language-servers = [
  "vtsls",
  "emmet-ls",
  "oxlint-language-server",
]

[[language]]
name             = "typescript"
auto-format      = true
formatter        = { command = "prettier", args = [ "--parser", "typescript" ] }
language-servers = [ "vtsls", "oxlint-language-server" ]

[language-server]
deno         = { command = "deno", args = [ "lsp" ] }
emmet-ls     = { command = "emmet-ls", args = [ "--stdio" ] }
terraform-ls = { command = "terraform-ls", args = [ "serve" ] }

[language-server.typos]
# typos-lsp must be on your PATH, or otherwise change this to an absolute path to typos-lsp
command = "typos-lsp"
# Logging level of the language server. Defaults to error.
# Run with helix -v to output LSP logs to the editor log (:log-open)
environment = { "RUST_LOG" = "error" }
# Custom config. Used together with a config file found in the workspace or its parents,
# taking precedence for settings declared in both. Equivalent to the typos `--config` cli argument.
config.config = "~/code/typos-lsp/crates/typos-lsp/tests/typos.toml"
# How typos are rendered in the editor, can be one of an Error, Warning, Info or Hint.
# Defaults to Warning.
config.diagnosticSeverity = "Warning"

# rust
[language-server.rust-analyzer.config.check]
workspace = false
command = "clippy"

[language-server.tombi]
command = "tombi"
args = [ "lsp" ]
provideFormatter = true

[language-server.vscode-json-language-server.config]
json             = { validate = { enable = true }, format = { enable = true } }
provideFormatter = true

[language-server.vscode-css-language-server.config]
css              = { validate = { enable = true } }
less             = { validate = { enable = true } }
provideFormatter = true
scss             = { validate = { enable = true } }

# yaml
[language-server.yaml-language-server.config.yaml]
format     = { enable = true }
validation = true

[language-server.yaml-language-server.config.yaml.schemas]
"https://json.schemastore.org/github-workflow.json"                                     = ".github/workflows/*.{yml,yaml}"
"https://raw.githubusercontent.com/ansible-community/schemas/main/f/ansible-tasks.json" = "roles/{tasks,handlers}/*.{yml,yaml}"

[language-server.oxlint-language-server]
command = "oxlint"
args = ["--lsp"]

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]
config.hostInfo = "helix"

[language-server.vtsls.config.typescript]
format.enable = false
inlayHints.enumMemberValues.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.variableTypes.enabled = true
preferences.importModuleSpecifier = "non-relative"
preferences.importModuleSpecifierEnding = "auto"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
tsserver.pluginPaths = ["typescript-plugin-css-modules", "./node_modules"]
updateImportsOnFileMove.enabled = "always"
