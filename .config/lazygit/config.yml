promptToReturnFromSubprocess: false
os:
  copyToClipboardCmd: printf "\033]52;c;$(printf {{text}} | base64 -w 0)\a" > /dev/tty
git:
  diffRenderers:
    - command: difft --color=always --display=inline
      type: extDiff
    - colorArg: always
      command: delta --paging=never
gui:
  border: rounded
  filterMode: fuzzy
  nerdFontsVersion: "3"
  # mainPanelSplitMode: "horizontal"
  theme:
    activeBorderColor:
      - '#e78284'
      - bold
    inactiveBorderColor:
      - '#a5adce'
    optionsTextColor:
      - '#8caaee'
    selectedLineBgColor:
      - '#414559'
    cherryPickedCommitBgColor:
      - '#51576d'
    cherryPickedCommitFgColor:
      - '#e78284'
    unstagedChangesColor:
      - '#e78284'
    defaultFgColor:
      - '#c6d0f5'
    searchingActiveBorderColor:
      - '#e5c890'
    authorColors:
      '*': '#babbf1'
